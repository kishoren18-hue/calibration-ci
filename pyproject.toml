[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-ci"
version = "0.2.0"
description = "Regression tests for model confidence: fail CI when calibration gets worse"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kishore Nuthalapati" }]
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["calibration", "llm", "evaluation", "ci", "github-action", "pytest"]

[project.urls]
Homepage = "https://github.com/kishoren18-hue/calibration-ci"
Issues = "https://github.com/kishoren18-hue/calibration-ci/issues"
Changelog = "https://github.com/kishoren18-hue/calibration-ci/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "pytest-cov>=5", "pre-commit>=3"]

[project.scripts]
calibration-ci = "calibration_ci.cli:main"

[project.entry-points.pytest11]
calibration_ci = "calibration_ci.pytest_plugin"

[tool.setuptools.package-data]
calibration_ci = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E501"]  # long lines are mostly HTML templates

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["E402"]
"examples/*" = ["E402"]
"benchmarks/*" = ["E402"]
